fiscal_calibration:
  base_year: 2025
  workbook:
    path: data/raw/brazil/demonstrativos-governo-geral.xlsx
    sheet: 1.2.a
    label_row_iloc: 3
    rows_iloc:
      total_revenue: 4
      interest_receivable: 15
      total_expense: 17
      interest_payable: 22
      primary_balance: 33
    unit_in_workbook: fraction_of_gdp
    source:
      name: Tesouro Nacional, Estatisticas Fiscais do Governo Geral
      url: https://www.tesourotransparente.gov.br/publicacoes/estatisticas-fiscais-do-governo-geral/2021/22
      table_series_code: "sheet 1.2.a; Q4 rolling-12-month column labels in iloc row 3; 2025-IV is iloc column 65"
    verified: local_workbook
  gross_debt_gdp_history:
    path: data/raw/brazil/macro/bcb_sgs_13762_dbgg_pct_gdp.json
    years: [2021, 2022, 2023, 2024, 2025]
  gross_debt_history_unit: percent_of_gdp
  gross_debt_history_range_basis: "point estimates only; exact December observations read from the untouched SGS JSON"
  gross_debt_history_source:
    name: Banco Central do Brasil, annual Fiscal Statistics releases; SGS 13762
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.13762/dados?formato=json
    table_series_code: end-December GGGD/DBGG, BCB concept; SGS 13762
    verified: local_json

interest_rate_calibration:
  use_legacy_nominal_rate_fallback: false
  years: [2021, 2022, 2023, 2024, 2025]
  gdp_deflator_history_pct:
    2021: 13.0
    2022: 8.6
    2023: 5.2
    2024: 3.8
    2025: 5.73
  range_basis: "For each year, exact Fisher conversion of the same-year Tesouro/BCB implicit nominal rate and IBGE GDP-deflator inflation; projection low/central/high is min/median/max of the five real rates"
  source:
    name: IBGE national accounts, annual GDP implicit deflator
    annual_table_url: https://anuario.ibge.gov.br/images/aeb/2024/s7/2_pdf/s7t5102.pdf
    sidra_table_url: https://sidra.ibge.gov.br/tabela/6784
    sidra_files: ["data/raw/brazil/macro/ibge_sidra_6784.json (2020-2023 deflator)", "data/raw/brazil/macro/ibge_sidra_1846_gdp_current_2024.json", "data/raw/brazil/macro/ibge_sidra_1846_gdp_current_2025.json", "data/raw/brazil/macro/ibge_sidra_5932_gdp_real_growth_2025.json"]
    table_series_code: "2021-2023: SIDRA 6784 'PIB - deflator - variacao anual' (13.0/8.6/5.2, matches); 2024: AEB table 7.5.1.2 (3.8; not yet in SIDRA 6784); 2025: derived = (GDP 2025 / GDP 2024 at current prices, SIDRA 1846) / (1 + real growth 2.3%, SIDRA 5932 v6563) - 1 = 5.71% (5.73 used; difference is rounding of the 2.3% real growth)"
  verified: "local_json for 2021-2023 and 2025 (checked by Claude 2026-10-20); 2024 secondary (IBGE yearbook PDF, not archived)"
  downloads_needed: []
  note: "Setting use_legacy_nominal_rate_fallback=true deliberately restores the old nominal-rate projection behavior."

growth_calibration:
  path: data/raw/brazil/macro/pwt1001.dta
  countrycode: BRA
  base_year: 2019
  labour_measure: emp
  tfp_periods:
    low: [2010, 2019]
    central: [2000, 2019]
    high: [2004, 2013]
  human_capital_periods:
    low: [2004, 2013]
    central: [2000, 2019]
    high: [2010, 2019]
  investment_rate_periods:
    low: [2015, 2019]
    central: [2000, 2019]
    high: [2004, 2013]
  source:
    name: Penn World Table 10.01
    url: https://dataverse.nl/api/access/datafile/354098
    doi: 10.34894/QT5BCC
    licence: CC BY 4.0
    variables: rgdpna, rnna, delta, emp, avh, hc, labsh, rtfpna
  range_basis: "TFP and human capital use configured compound averages; investment low/central/high are arithmetic averages of annual PWT-implied rates for 2015-2019 / 2000-2019 / 2004-2013"
  note: "Projection alpha=1-labsh, delta, K/Y and the employment anchor use the 2019 Brazil row. Investment is derived on the same PWT constant-2017-national-price basis as K and Y. Historical validation dynamically accumulates K from its 2000 level."

macro:
  initial_debt_gdp:
    low: null
    central: null
    high: null
    unit: percent_of_gdp
    year: 2025
    range_basis: "point estimate only"
    source:
      name: Banco Central do Brasil, SGS 13762
      url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.13762/dados?formato=json
      table_series_code: December 2025 GGGD/DBGG, BCB concept
    verified: local_json
  effective_nominal_interest_rate:
    unit: percent_per_year
    years: 2021-2025
    range_basis: "minimum / median / maximum of workbook interest payable divided by same-year end-December GGGD for the five complete years 2021-2025"
    source:
      name: Tesouro workbook sheet 1.2.a interest payable and BCB GGGD
      url: https://www.tesourotransparente.gov.br/publicacoes/estatisticas-fiscais-do-governo-geral/2021/22
      alternate_url: https://www.bcb.gov.br/estatisticas/estatisticasfiscais
      table_series_code: "interest payable iloc row 22, Q4 columns 2021-IV to 2025-IV; debt is fiscal_calibration.gross_debt_gdp_history"
    verified: calculated_from_full_text_and_local_workbook
    note: "Historical calibration only. Projection uses effective_real_interest_rate reinflated by the projected GDP deflator unless the explicitly labelled legacy fallback flag is enabled."
  effective_real_interest_rate:
    low: null
    central: null
    high: null
    unit: percent_per_year
    years: 2021-2025
    range_basis: "minimum / median / maximum of same-year Fisher real rates"
    source:
      name: Derived from Tesouro/BCB nominal implicit rates and IBGE GDP deflator
      formula: "(1 + nominal implicit rate_t) / (1 + GDP deflator inflation_t) - 1"
    verified: calculated_from_sourced_observations
  revenue_gdp:
    unit: percent_of_gdp
    year: 2025
    range_basis: "point estimate only"
    source:
      name: Tesouro Nacional, Estatisticas Fiscais do Governo Geral
      url: https://www.tesourotransparente.gov.br/publicacoes/estatisticas-fiscais-do-governo-geral/2021/22
      table_series_code: "sheet 1.2.a, 2025-IV column (iloc 65): total revenue iloc row 4 minus interest receivable iloc row 15"
    verified: calculated_from_local_workbook
    note: "src.macro.load_macro_inputs reads this value from the untouched workbook; it is not hand-entered."
  gdp_deflator_growth:
    low: 3.0
    central: 3.0
    high: 3.8
    unit: percent_per_year
    year: 2024-2026
    range_basis: "3.0% current continuous inflation target (low/central); 3.8% latest sourced annual GDP deflator observation (high)"
    sources:
      target:
        name: Banco Central do Brasil, inflation targeting regime
        url: https://www.bcb.gov.br/en/monetarypolicy/inflationtargeting
        table_series_code: continuous target from January 2025, 3.0 percent
      observed:
        name: IBGE, Anuario Estatistico do Brasil 2024
        url: https://anuario.ibge.gov.br/images/aeb/2024/s7/2_pdf/s7t5102.pdf
        table_series_code: Tabela 7.5.1.2, deflator implicito, variacao anual
    verified: full_text
    note: "The target is the central long-run assumption; the latest sourced observed deflator supplies the upper sensitivity bound."
  tfp_growth:
    low: null
    central: null
    high: null
    unit: percent_per_year
    range_basis: "calculated from PWT rtfpna sub-period compound averages configured in growth_calibration"
    source: {name: Penn World Table 10.01, variable: rtfpna}
    verified: calculated_from_local_stata
  human_capital_growth:
    low: null
    central: null
    high: null
    unit: percent_per_year
    range_basis: "sorted compound-average growth rates across the three growth_calibration sub-periods"
    source: {name: Penn World Table 10.01, variable: hc}
    verified: calculated_from_local_stata
  capital_share:
    low: null
    central: null
    high: null
    unit: share
    year: 2019
    range_basis: "point estimate only; 1 minus PWT labour share"
    source: {name: Penn World Table 10.01, variable: labsh}
    verified: calculated_from_local_stata
  investment_rate:
    low: null
    central: null
    high: null
    unit: percent_of_gdp
    price_basis_id: pwt1001_constant_2017_national_prices
    range_basis: "PWT-implied gross investment arithmetic averages: low 2015-2019; central 2000-2019; high 2004-2013"
    source:
      name: Penn World Table 10.01
      variables: "(rnna[t] - (1-delta[t])*rnna[t-1]) / rgdpna[t]"
    verified: calculated_from_local_stata
  capital_output_ratio:
    low: null
    central: null
    high: null
    unit: ratio
    price_basis_id: pwt1001_constant_2017_national_prices
    year: 2019
    range_basis: "point estimate only; PWT rnna divided by rgdpna"
    source: {name: Penn World Table 10.01, variables: rnna / rgdpna}
    verified: calculated_from_local_stata
  contextual_indicators_not_used:
    ibge_nominal_investment_rate:
      value: 16.8
      unit: percent_of_gdp
      year: 2025
      label: "not used: different price basis"
      source:
        name: IBGE, Quarterly National Accounts, fourth quarter 2025
        url: "https://apisidra.ibge.gov.br/values/t/1846/n1/all/v/585/p/202501,202502,202503,202504/c11255/90707?formato=json"
        local_file: "data/raw/brazil/macro/ibge_sidra_1846_gdp_current_2025.json (Q1-Q4 sum R$12,738,566 million)"
        table_series_code: 2025 investment rate (GFCF/GDP)
      verified: full_text
  depreciation_rate:
    low: null
    central: null
    high: null
    unit: percent_per_year
    year: 2019
    range_basis: "point estimate only"
    source: {name: Penn World Table 10.01, variable: delta}
    verified: calculated_from_local_stata
  okun_coefficient:
    low: 0.140473
    central: 0.1878
    high: 0.2055
    unit: unemployment_percentage_points_per_output_gap_percent
    year: 1980Q1-2015Q2
    range_basis: "range across sourced estimates from two Brazil studies"
    source:
      name: Jin and Harper (2019); Pessoa (2014), estimates for Brazil
      url: https://scholar.valpo.edu/cba_fac_pub/72/
      alternate_url: https://mpra.ub.uni-muenchen.de/56388/1/MPRA_paper_56388.pdf
      table_series_code: reported Okun coefficients
    verified: abstract
    note: Low is Jin-Harper; central/high are the lower/upper Pessoa estimates.
  base_real_gdp:
    low: 12738600
    central: 12738600
    high: 12738600
    unit: million_2025_brl
    year: 2025
    range_basis: "point estimate only"
    source:
      name: IBGE, Quarterly National Accounts, fourth quarter 2025
      url: "https://apisidra.ibge.gov.br/values/t/1846/n1/all/v/585/p/202501,202502,202503,202504/c11255/90707?formato=json"
      local_file: "data/raw/brazil/macro/ibge_sidra_1846_gdp_current_2025.json (Q1-Q4 sum R$12,738,566 million)"
      table_series_code: Section III and Table III.1, 2025 GDP at current prices, R$12,738.6 billion
    verified: full_text
    note: "Current-price 2025 GDP anchors the model's real index; subsequent changes are real growth-accounting changes."
  base_gdp_per_capita:
    low: 59687.49
    central: 59687.49
    high: 59687.49
    unit: 2025_brl_per_person
    year: 2025
    range_basis: "point estimate only"
    source:
      name: IBGE, Quarterly National Accounts, fourth quarter 2025
      url: https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/45968-pib-cresce-2-3-em-2025-e-fecha-o-ano-em-r-12-7-trilhoes
      table_series_code: PIB per capita 2025
    verified: full_text

published_potential_growth_benchmark:
  central: 2.5
  unit: percent_per_year
  year: 2025
  range_basis: "point estimate only"
  source:
    name: IMF, Brazil 2025 Article IV Consultation
    url: https://www.imf.org/-/media/files/publications/cr/2025/english/1braea2025001-source-pdf.pdf
    table_series_code: medium-term real GDP growth forecast, described as convergence to potential
  verified: full_text
