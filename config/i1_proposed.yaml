path_derivation: 2026-2029 latest Focus Fisher real rates; 2030-2034 five equal annual
  steps to 5%; thereafter 5%. Starting from the 2025 implicit real debt rate, annual
  changes apply current and lagged pass-through to current and lagged changes in the
  real-policy rate; the 2026 lag uses observed 2024-2025 rates.
