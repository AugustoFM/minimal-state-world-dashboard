# --- Long-run feedback block (C5) -------------------------------------------------------------
# Added 2026-10-20 (Claude). Four channels through which spending choices change potential growth or
# financing costs over 5-20 years. Two favour keeping spending (human capital, public capital), one can
# cut either way (inequality), one favours lower debt (risk premium). All run as a variant on top of C2,
# never as the only path, and each can be switched off to show its contribution.
long_run_feedback:
  human_capital_from_schooling:
    # Links C4 schooling change to the PWT human-capital index used in C2 growth accounting.
    mapping: "hc = exp(phi(s)); phi piecewise linear in mean years of schooling s"
    returns_per_year_of_schooling: {up_to_4_years: 0.134, years_4_to_8: 0.101, above_8_years: 0.068}
    source: "Penn World Table, 'Human capital in PWT 9.0' (Feenstra, Inklaar & Timmer), eq. 1; rates from Psacharopoulos (1994)"
    url: "https://www.rug.nl/ggdc/docs/human_capital_in_pwt_90.pdf"
    verified: full_text
    note: "Brazil adult mean schooling is above 8 years, so the marginal return is 0.068. Requires C4 to turn cohort schooling gains into adult mean years (cohort replacement) - C5 task."
  health_to_output:
    # Effect of one extra year of life expectancy on output (labour productivity).
    unit: "% change in output per +1 year of life expectancy"
    low: 0.0
    central: null
    high: 4.0
    range_basis: "two conflicting studies; no central value is defensible, so sample uniform[low, high] (choice)"
    sources:
      high: "Bloom, Canning & Sevilla (2001) NBER WP 8587, abstract and conclusion: +1 year LE -> +4% output (cross-country production function)"
      low: "Acemoglu & Johnson (2007) 'Disease and Development' (JPE 115(6)), abstract: estimates exclude positive effects of life expectancy on GDP per capita within 40-60 year horizons"
    urls: ["https://www.nber.org/system/files/working_papers/w8587/w8587.pdf", "https://baselinescenario.com/wp-content/uploads/2009/08/disease-and-development.pdf"]
    verified: full_text
  public_capital:
    # Output elasticity of the public capital stock; investment changes accumulate into it.
    unit: "elasticity of output to public capital stock"
    low: 0.083
    central: 0.106
    high: 0.122
    range_basis: "Bom & Ligthart (2014) meta-analysis headline estimates: short-run 0.083, sample average 0.106, long-run 0.122 (central-government public capital)"
    source: "Bom & Ligthart (2014), Journal of Economic Surveys 28(5): 889-916; 578 estimates from 68 studies"
    url: "https://ucrisportal.univie.ac.at/en/publications/what-have-we-learned-from-three-decades-of-research-on-the-produc/"
    verified: abstract
    note: "Core infrastructure at regional/local level roughly doubles these (abstract) - not used. Needs an initial Brazil public capital stock and depreciation (e.g. IMF Investment and Capital Stock Dataset) - data to download in C5."
  sovereign_risk_premium:
    # Change in long-term government borrowing rate per percentage point of GDP change in public debt.
    unit: "basis points per 1 pp of GDP change in debt/GDP"
    low: 2
    central: 5
    high: 7
    range_basis: "low/high = literature range summarised in Baldacci & Kumar (2010) section II (2-7 bp); central = their own panel estimate (~5 bp, 31 advanced and emerging economies, 1980-2008)"
    source: "Baldacci & Kumar (2010), IMF WP 10/184"
    url: "https://www.imf.org/external/pubs/ft/wp/2010/wp10184.pdf"
    verified: full_text
    deficit_channel_note: "Same paper: +1 pp GDP deficit -> +20 (nominal) to +30 (real) bp; up to 50 bp with high initial deficits/debt or low saving. Use the debt channel only, to avoid double counting; report the deficit channel as a sensitivity."
    applies_to: "deviation of debt/GDP from its base-year level (all scenarios, S0 included), added to the real implicit rate in the debt recursion"
    deviation_cap_pp: 50   # choice (2026-10-20): out-of-sample guard; the estimate comes from much smaller debt changes. Uncapped run reported as sensitivity.
  inequality_to_growth:
    # Effect of net (after taxes and transfers) Gini on growth. Needs C3; switched off until C3 exists.
    unit: "pp of annual GDP growth per +1 net Gini point (0-100 scale)"
    low: null
    central: -0.1
    high: null
    range_basis: "point estimate only: Ostry, Berg & Tsangarides (2014) net Gini 37 -> 42 lowers growth ~0.5 pp/yr (section III.A), i.e. -0.1 per point"
    duration_effect: "+1 Gini point -> ~7% shorter expected growth spell (same paper, section III.B); not used"
    source: "Ostry, Berg & Tsangarides (2014), IMF Staff Discussion Note 14/02"
    url: "https://www.imf.org/external/pubs/ft/sdn/2014/sdn1402.pdf"
    verified: full_text
    caveat: "Cross-country panel association; causality contested. Off by default; run as a separate variant once C3 produces net Gini paths."
    status: "inactive until C3"
long_run_feedback_choices:
  # Lead-developer choices for C5 (status: choice).
  run_as: "variant 'with_feedback' alongside 'without_feedback' for every scenario; never replaces C2 results"
  channels_default_on: [human_capital_from_schooling, health_to_output, public_capital, sovereign_risk_premium]
  channels_default_off: [inequality_to_growth]
  symmetry: "every channel applies to spending increases and cuts alike (same evidence standard for both)"
  attribution: "report each channel's contribution separately (one-at-a-time switch-off), so the dashboard can show which channel drives the gap"

# --- External block (C6) ----------------------------------------------------------------------
# Added 2026-10-20 (Claude) after reviewing 2003-2010: exports, reserves, FDI, the exchange rate and
# falling interest rates moved with a ~37% rise in the terms of trade (WDI, 2005-2011). The model was
# a closed economy; C6 adds the external environment as an exogenous, uncertain driver.
external_block:
  gdp_model: c7_channel_a   # c7_channel_a (default since 2026-10-21) or c6_terms_of_trade
  output_channel_c7:
    status: "choice (lead developer 2026-10-21); C7 channel A verdict 'supported' (outputs/c7_backtest.md)"
    equation: "growth deviation (pp) = b0 dlnP_t + b1 dlnP_t-1 + b2 (world growth - mean); dlnP = 100 x change in ln Brazil commodity export price index (IMF PCTOT); level effect = cumulated deviations"
    source: "data/brazil/c7_estimates.csv (OLS, Newey-West; constants not used)"
    coefficient_sets:
      primary_2000_2014: {dlnP: 0.125351, dlnP_lag: -0.006986, world_gdp_growth_pct: 0.520133}
      reverse_2010_2024: {dlnP: 0.082437, dlnP_lag: 0.064964, world_gdp_growth_pct: 0.762034}
    sampling: "one set per Monte Carlo draw, equal probability (separate random stream [seed, 3]); central = average of the two sets"
    bootstrap_inputs: "joint 2001-2024 changes of dlnP, world growth and BRL/USD (3-year blocks); dlnP and world growth demeaned over the sample so draws add shocks, not a trend"
    replaces: "gdp_wrt_commodity_prices below for the GDP level effect (kept for the C6 option and the D2 growth block); FX pass-through unchanged"
    not_wired: "C7 channels B (spread/interest: not supported) and C (investment: part of A's total response)"
    dividend_revenue:
      lnP: 0.837985
      source: "C7 D_dividends (fit 2010-2017, out-of-sample RMSE 0.231 vs naive 0.285, supported); data/brazil/c7_estimates.csv"
      use: "general-government dividends change by lnP x cumulative change in ln commodity export prices (pp GDP), same for every scenario; added to the primary balance in the external debt path (debt_gdp_with_external only; C5 does not carry external effects)"
      decided: "lead developer 2026-10-21 at the user's request (best guess from the back-tests); payout policy held at current law for every scenario"
  gdp_wrt_commodity_prices:
    unit: "% change in Brazil GDP level per 1% change in its commodity price index (3-year horizon)"
    low: null
    central: 0.033
    high: null
    range_basis: "derived point estimate: Gruss (2014) GVAR, a 1% fall in China GDP lowers LAC commodity price indices ~3% on impact (Figure 12) and Brazil GDP ~0.1% after three years (Figure 13); 0.1 / 3 = 0.033 (our division; includes non-price China spillovers)"
    source: "Gruss (2014), IMF WP 14/154, section IV.B"
    url: "https://www.imf.org/external/pubs/ft/wp/2014/wp14154.pdf"
    verified: full_text
    brazil_note: "Brazil is 'a much less open economy' with a smaller response than LAC peers, and one of two countries without a further projected slowdown under stable prices (same paper)."
  potential_vs_actual_output:
    rule: "commodity terms-of-trade swings move actual output about twice as much as potential output; the drag on potential growth is about one third of the drag on actual growth"
    source: "IMF World Economic Outlook, October 2015, Chapter 2 'Where Are Commodity Exporters Headed?' (summary)"
    url: "https://www.tralac.org/images/docs/8180/weo2015-chapter-2-where-are-commodity-exporters-headed-october-2015.pdf"
    verified: abstract
    use: "split C6 effects into a transitory (actual) and a persistent (potential) part"
  exchange_rate_pass_through:
    unit: "pp of cumulative IPCA inflation per 1% BRL depreciation"
    horizon_12m: {low: null, central: 0.10, high: null}
    horizon_24m: {low: null, central: 0.16, high: null}
    range_basis: "point estimates; 90% CIs shown only in figures and described as 'quite wide' (not digitised)"
    source: "Banco Central do Brasil, Monetary Policy Report March 2026, box 'exchange rate pass-through' (local projections, Jul 2006 - Dec 2025, commodity prices controlled)"
    url: "https://www.bcb.gov.br/content/ri/inflationreport/202603/rpm202603b8i.pdf"
    verified: full_text
  external_paths:
    rule: "external environment (commodity terms of trade, exchange rate) drawn as whole historical paths by block bootstrap of observed annual changes, not invented scenarios"
    data: "data/brazil/backtest_observed.csv (WDI net barter terms of trade 2005-2024, BRL/USD 2000-2024); a longer terms-of-trade series (e.g. FUNCEX via IPEAData) is needed for 2003-2004 and for a richer sample"
    status: choice
  gaps:
    - "revenue from commodities (oil royalties, special participations) beyond revenue moving with GDP: not yet sourced"
    - "FX-linked share of public debt (valuation effect of the exchange rate on debt): data to download from BCB"
    - "capital flows / FDI response: not modelled; FDI shown as context only"
external_block_choices:
  run_as: "dimension 'external' in D1: historical-bootstrap paths sampled per draw, plus fixed 'boom' / 'neutral' / 'bust' reference paths reported separately"
  symmetry: "the same external paths apply to every policy scenario, so external luck is not credited to or blamed on a policy"
  back_test: "D2 must feed observed 2003-2015 and 2017-2022 external paths and report whether the model reproduces actual GDP growth, debt and inflation before any projection is published"

# --- Governance / corruption (added 2026-10-20, Claude) ------------------------------------------
# Party-neutral: corruption enters as leakage of public spending before it becomes services, applied
# identically to every scenario and programme. Perception indices by government period are context
# only (data/brazil/governance_brazil.csv): they mix actual corruption with its exposure (e.g. Lava
# Jato 2014-17) and differences between recent governments are within their error bands.
governance:
  leakage_share_of_spending:
    unit: "share of social-service spending that does not become services (diverted)"
    low: 0.028
    central: null
    high: 0.13
    sampling: "uniform[low, high] (choice; the two bounds come from different measures, no central is defensible)"
    range_basis: "low = Ferraz, Finan & Moreira (2012): corruption in education detected in 35% of audited municipalities, 8% of audited education resources diverted there -> 0.35 x 0.08 = 0.028 expected (our multiplication); high = lower end of Transparência Brasil (2005) estimate that 13-55% of FUNDEF 2001-03 was lost to fraud, as cited in the same paper (fn. 13, secondary)"
    source: "Ferraz, Finan & Moreira (2012), J. Public Economics 96; NBER WP 18150, section 3.1 and fn. 13"
    url: "https://www.nber.org/system/files/working_papers/w18150/w18150.pdf"
    verified: full_text
    scope: "municipal education transfers 2001-2005; applied to health and education as a proxy"
    model_effect: "scales services per real spent in every scenario; cancels out of scenario-vs-S0 comparisons unless a policy changes it"
  leakage_reduction_sensitivity:
    fraction_of_leakage_removed: 0.5
    status: "choice: illustrative 'leakage halved' sensitivity available to any scenario; neither 2026 programme quantifies its anti-fraud measures"
  corruption_learning_association:
    value_sd: -0.35
    se: 0.076
    source: "Ferraz, Finan & Moreira (2012), Table 4 col. 1: students in municipalities with detected education corruption score 0.35 SD lower (association, not causal)"
    use: "context only; not wired into C4"
  perception_indices:
    wgi_control_of_corruption: "World Bank WGI, GOV_WGI_CC.EST (-2.5 to 2.5), Brazil 1996-2025"
    cpi: "Transparency International CPI 2012-2025 (0-100), with standard errors"
    use: "context only; not a model input"

# --- Revenue response to GDP (added 2026-10-20, Claude; used by the revenue-path extension, P1) ---
revenue_elasticity_to_gdp:
  # IFI (Senado) Estudo Especial no 16, Nov 2021: central-government recurring revenue, quarterly 1997-2021,
  # cointegration (long run) and error-correction (short run) estimates split by sign of the output gap.
  source: "IFI Estudo Especial no 16 (Nov 2021), Tables 2-4"
  url: "https://www12.senado.leg.br/ifi/pdf/estudo-especial-no-16-a-elasticidade-da-receita-em-relacao-ao-pib-nov-2021"
  verified: full_text
  scope: "federal (central-government) total revenue; applied to general-government revenue as a proxy"
  long_run_total_revenue: {negative_gap: 0.92, positive_gap: 0.98}
  short_run_total_revenue: {negative_gap: 1.17, positive_gap: 1.51}
  error_correction_per_quarter: -0.63
  annual_use: "the error correction closes most of the short-run overshoot within a year, so the annual model uses the long-run values: low 0.92, high 0.98 (central null; sample uniform). The current C2 rule (revenue a fixed share of GDP) is elasticity 1.0, slightly above both."
  low: 0.92
  central: null
  high: 0.98
