# v1 DEFAULTS (applied 2026-10-20). Starting assumptions, not findings. Task B1 may tighten them.
state_definition: general_government_primary_spending_pct_gdp   # federal + state + municipal; SOEs later as variant
horizons_years: [5, 10, 15, 20]
validate_first_horizon: 10
scenarios:
  S0:  {name: status_quo, description: "current rules; pension+health rise with ageing; revenue unchanged; debt drifts up"}
  S1:  {name: constant_size, optional: true, description: "spending/GDP held at today's share (cost of offsetting ageing drift)"}
  R_mod: {name: moderate_reduction, pace_pp_gdp_per_year_below_S0: 0.2, by_year: {5: 1, 10: 2, 15: 3, 20: 4}}
  R_amb: {name: ambitious_reduction, pace_pp_gdp_per_year_below_S0: 0.4, by_year: {5: 2, 10: 4, 15: 6, 20: 7.0}, cap: "B1 conservative precedent cap applied at 20y (8 -> 7.0); 15y is inside by only 0.1 pp"}
  R_max: {name: edge_of_experience, optional: true, by_year: {5: 4.2, 10: 5.5, 15: 7.3, 20: 8.5}, description: "B1 central precedent cap: change from today at the 10th percentile of observed middle-income changes; needs legislation of nearly its full size; stress case, not a recommendation"}
  E_mod: {name: moderate_expansion, direction: above_S0, pace_pp_gdp_per_year_above_S0: 0.2, by_year: {5: 1, 10: 2, 15: 3, 20: 4}, financing: debt, description: "mirror of R_mod: spending 0.2 pp GDP/yr above S0; within the observed p90 increase at every horizon"}
  E_amb: {name: ambitious_expansion, direction: above_S0, pace_pp_gdp_per_year_above_S0: 0.4, by_year: {5: 2, 10: 4, 15: 4.8, 20: 4.6}, financing: debt, cap: "mirror of R_amb, capped at 15/20y by the observed p90 increase in middle-income countries minus C1 drift_low (central precedent cap; S0 already rises with ageing)"}
  E_mod_tax: {name: moderate_expansion_tax_financed, direction: above_S0, by_year: {5: 1, 10: 2, 15: 3, 20: 4}, revenue_by_year: {5: 1, 10: 2, 15: 3, 20: 4}, financing: taxes, description: "E_mod with revenue raised by the same pp of GDP (balanced budget vs S0); tax GDP effect via the Sanches et al. revenue multiplier"}
  E_amb_tax: {name: ambitious_expansion_tax_financed, direction: above_S0, by_year: {5: 2, 10: 4, 15: 4.8, 20: 4.6}, revenue_by_year: {5: 2, 10: 4, 15: 4.8, 20: 4.6}, financing: taxes, description: "E_amb with revenue raised by the same pp of GDP"}
# by_year sizes are authoritative (direction: above_S0 marks expansions, gap negative; revenue_by_year = tax change above S0 revenue, pp GDP); pace_pp_gdp_per_year_below_S0 is the nominal pace (R_amb is capped at 20y by B1). Paths ramp linearly between horizons.
reduction_is_measured_against: S0        # not against today; part of the effort offsets ageing drift
package_shares: {pension_and_indexation: 0.40, subsidies_and_tax_expenditures: 0.25, efficiency_health_education_admin: 0.20, other_current: 0.15}
protected: [public_investment, means_tested_transfers]
variants: [default, pension_only, efficiency_only, investment_also_cut_stress, compensating_transfers]
variant_definitions:   # lead-developer choices for D1 (2026-10-20); shares of the reduction R(h), each set sums to 1 unless noted
  default: "package_shares above"
  pension_only: {pension_and_indexation: 1.0}
  efficiency_only: {efficiency_health_education_admin: 1.0}
  investment_also_cut_stress: {pension_and_indexation: 0.32, subsidies_and_tax_expenditures: 0.20, efficiency_health_education_admin: 0.16, other_current: 0.12, public_investment: 0.20}   # default x 0.8 + 20% investment
  compensating_transfers: {gross_cut_multiple_of_R: 1.1, gross_cut_shares: "package_shares", means_tested_transfers_increase_share_of_R: 0.1, note: "cut 1.1 R with default shares, return 0.1 R as means-tested transfers (social_benefits multiplier); net reduction stays R"}
  status: choice
outputs: [gdp_per_capita, debt_gdp, unemployment, gini, top1_share, top10_share, poverty, life_expectancy, schooling, health_access, hdi_components]
percentiles: [10, 50, 90]

b1_calibration:   # task B1, 2026-10-20; reproduce with scripts/calibrate_b1.py -> data/brazil/b1_calibration.csv, b1_sensitivity.csv
  # Two separate bounds. Precedent: how far spending/GDP has fallen elsewhere. Implementability: how much can
  # be cut without new law. Neither is a forecast of what Brazil will do.
  precedent_bound:
    method: "cap_below_S0(h) = C1 drift_low(h) - p10(h); p10 = country-weighted 10th percentile of observed spending/GDP change, middle-income countries, A4 episodes"
    method_choices: {percentile: 0.10, spike_start_pp: 3, series_break_pp: 10, status: "choice; sensitivity in b1_sensitivity.csv"}
    observed_change_p10_pp: {5: -2.8, 10: -2.6, 15: -3.0, 20: -2.7}
    sensitivity_p10_pp:
      threshold_grid: {5: [-3.6, -2.5], 10: [-3.7, -2.0], 15: [-4.3, -2.3], 20: [-5.1, -2.6]}
      leave_one_country_out: {5: [-2.8, -2.7], 10: [-2.6, -2.3], 15: [-3.0, -2.6], 20: [-2.8, -2.1]}
      country_bootstrap_q10_q90: {5: [-3.0, -2.5], 10: [-3.1, -2.1], 15: [-4.4, -1.8], 20: [-5.4, -1.2]}
    c1_drift_low_pp: {5: 1.4, 10: 2.9, 15: 4.3, 20: 5.8}
    cap_central_pp: {5: 4.2, 10: 5.5, 15: 7.3, 20: 8.5}
    cap_conservative_pp: {5: 3.9, 10: 4.9, 15: 6.1, 20: 7.0}   # uses bootstrap q90 of p10 (least negative)
    classification: {R_mod: "inside at all horizons", R_amb: "inside at 5/10/15y (15y margin 0.1 pp); 8 pp at 20y was borderline, so capped to 7.0"}
    caveat: "Cap assumes the C1 ageing drift happens; a lower drift (e.g. pension-reform transition) lowers the cap one-for-one."
  implementability_bound:
    federal_discretionary_2024_pct_gdp: 1.6   # IFI RAF 101 (Jun 2025) Table 6; 8.4% of federal primary spending
    mandatory_rules_min_pp:   # reduction minus ALL federal discretionary spending: the least that must change mandatory rules
      R_mod: {5: 0.0, 10: 0.4, 15: 1.4, 20: 2.4}
      R_amb: {5: 0.4, 10: 2.4, 15: 4.4, 20: 5.4}
    one_year_max_withholding_pp: 0.4   # 25% of authorised discretionary (LC 200/2023 art. 7 para 2, quoted in IFI RAF 103 fn. 20); single-year budget tool, NOT a multi-year allowance
    reading: "Lower bounds only: they assume all federal discretionary spending could be eliminated, which is not realistic. From 10 years on, both R paths require changes to mandatory-spending rules (pensions/indexation, subsidies/tax expenditures), which the default package already targets (65%)."
    precedent_for_legislation: "EC 103/2019 pension reform: estimated 10-year savings R$ 855-870 bn (government / IFI, Sept-Nov 2019; secondary, not yet converted to % GDP)"
    status: "federal only, 2024 level held constant; no sourced reform-timing envelope yet, so implementability is reported, not used to resize paths"
  proxies: ["episodes use central-government expense (WDI), not general-government primary spending", "discretionary share is federal only; states and municipalities not covered"]
  data_issues: ["WDI expense has series breaks (e.g. Nicaragua 65% in 1990 to 11% in 1994); screened here, still present in A4 episodes_summary.csv"]
  changed_defaults: "R_amb 20y 8 -> 7.0 (conservative precedent cap); added optional R_max. R_mod unchanged."
